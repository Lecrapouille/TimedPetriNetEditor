name: Non regression tests for TimedPetriNetEditor
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  non_regression_linux:
    name: Non regression tests on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install libdw-dev pkg-config libmosquitto-dev libzmq3-dev libx11-dev libxinerama-dev
          sudo apt-get install libasound2-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev
          sudo apt-get install libwayland-dev libxkbcommon-x11-dev libglfw3-dev libxcursor-dev libxinerama-dev
          sudo apt-get install xvfb python3-zmq
      - name: Checkout TimedPetriNetEditor
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Compile TimedPetriNetEditor
        run: |
          V=1 make
          V=1 sudo make install MYMAKEFILE_CACHE="$HOME/.cache/mymakefile"
      - name: Download, configure and install Google test
        run: |
          wget https://github.com/google/googletest/archive/v1.17.0.tar.gz
          tar xf v1.17.0.tar.gz
          cd googletest-1.17.0
          cmake -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON .
          sudo make install
      - name: Do non regression tests
        run: |
          V=1 make check
      - name: Compile and run the examples of the runtime
        run: |
          make -C examples run
      - name: Check the generated GRAFCET code against the engine
        run: |
          tests/codegen/run.sh
      - name: Test the remote control and the journal published on ZeroMQ
        run: |
          BUILD=$(make -s print-BUILD)
          xvfb-run -a python3 tests/remote/test_remote.py $BUILD/bin/TimedPetriNetEditor build/examples/Debugger
      - name: Check the properties of the examples
        run: |
          BUILD=$(make -s print-BUILD)
          $BUILD/bin/tpne-check examples/Petri-Nets/Philosophers/Philosophers.json examples/Petri-Nets/ProducerConsumer/ProducerConsumer.json
          $BUILD/bin/tpne-check --allow-deadlock examples/Runtime/PickAndPlace/PickAndPlace.json
      - name: Check if the library can be linked against a project
        run: |
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib/
          git clone https://github.com/Lecrapouille/LinkAgainstMyLibs.git --recurse-submodules --depth=1
          cd LinkAgainstMyLibs/TimedPetriNetEditor
          V=1 make
          $(make -s print-BUILD)/bin/TimedPetriNetEditor

  sanitizers_linux:
    name: Unit tests with AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install pkg-config
      - name: Checkout TimedPetriNetEditor
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Download, configure and install Google test
        run: |
          wget https://github.com/google/googletest/archive/v1.17.0.tar.gz
          tar xf v1.17.0.tar.gz
          cd googletest-1.17.0
          cmake -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON .
          sudo make install
      - name: Compile and run the unit tests with sanitizers
        run: |
          V=1 make check SANITIZER=address,undefined

  thread_sanitizer_linux:
    name: Runtime tests with ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install pkg-config
      - name: Checkout TimedPetriNetEditor
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Download, configure and install Google test
        run: |
          wget https://github.com/google/googletest/archive/v1.17.0.tar.gz
          tar xf v1.17.0.tar.gz
          cd googletest-1.17.0
          cmake -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON .
          sudo make install
      - name: Compile and run the runtime tests with ThreadSanitizer
        run: |
          GTEST_FILTER='TestRuntime*:TestExecutor*:TestCallback*' GTEST_REPEAT=20 \
            V=1 make check SANITIZER=thread

  non_regression_macos:
    name: Non regression tests on MacOS X
    runs-on: macos-latest
    steps:
      - name: Install system packages
        run: |
          brew install make pkg-config mosquitto zeromq glfw glew
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix zeromq)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$(brew --prefix zeromq)/include ${CPPFLAGS:-}" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix zeromq)/lib ${LDFLAGS:-}" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Compile TimedPetriNetEditor
        run: |
          V=1 gmake
      - name: Download, configure and install Google test
        run: |
          wget https://github.com/google/googletest/archive/v1.17.0.tar.gz
          tar xf v1.17.0.tar.gz
          cd googletest-1.17.0
          cmake -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON .
          sudo make install
      - name: Do non regression tests
        run: |
          V=1 gmake check
      - name: Create the DMG file
        run: |
          BUILD=$(gmake -s print-BUILD)
          test -d $BUILD/bin/TimedPetriNetEditor.app
          hdiutil create -format UDZO -srcfolder $BUILD/bin/TimedPetriNetEditor.app build/TimedPetriNetEditor.dmg
      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: TimedPetriNetEditor-macos
          path: build/TimedPetriNetEditor.dmg
