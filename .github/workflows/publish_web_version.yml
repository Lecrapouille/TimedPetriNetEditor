name: Publish the online TimedPetriNetEditor version on GitHub page
on:
  push:
    branches:
      - master
  workflow_dispatch:
    branches:
      - master

jobs:
  # A page opened alone in a browser needs the plain Emscripten build. The
  # ExaequOS build only runs inside the ExaequOS desktop (see build_exaequos).
  build_html5:
    name: Publish on gh-pages
    runs-on: ubuntu-22.04
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install pkg-config libmosquitto-dev libx11-dev libxinerama-dev
          sudo apt-get install libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev
          sudo apt-get install libwayland-dev libxkbcommon-x11-dev libglfw3-dev
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
      - name: Checkout TimedPetriNetEditor
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Compile TimedPetriNetEditor
        run: |
          make download-external-libs
          emmake make compile-external-libs
          emmake make -j`nproc --all`
      - name: Deploy
        run: |
          git config --global user.name 'GitHub CI'
          git config --global user.email 'github-ci@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git fetch --all
          git checkout gh-pages
          cp build/TimedPetriNetEditor.* .
          git add TimedPetriNetEditor.*
          if git diff --cached --quiet; then
            echo "Nothing new to publish"
          else
            git commit -m "Automated commit"
            git push
          fi

  # The image sets EXAEQUOS and puts emscripten-exa on PATH. `make` then
  # installs exa-wayland and glfw, and writes the program in
  # media/localhost/TimedPetriNetEditor/exa/, kept as an artifact of the run.
  build_exaequos:
    name: Compile for ExaequOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TimedPetriNetEditor
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Compile with ExaequOS
        run: |
          mkdir -p "$HOME/.cache/exaequos"
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:$PWD" \
            -v "$HOME/.cache/exaequos:/opt/emscripten-exa/cache" \
            -w "$PWD" \
            lecrapouille/exaequos:light \
            bash -c 'make download-external-libs && make compile-external-libs && make -j"$(nproc)" && make install'
      - name: Keep the ExaequOS build
        uses: actions/upload-artifact@v4
        with:
          name: TimedPetriNetEditor-exaequos
          path: media/localhost/TimedPetriNetEditor/exa/
