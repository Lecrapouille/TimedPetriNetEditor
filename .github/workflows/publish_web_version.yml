name: Publish the online TimedPetriNetEditor version on GitHub page
on:
  push:
    branches:
      - master
  workflow_dispatch:
    branches:
      - master

# GitHub Pages serves the page from an artifact of the run (no gh-pages
# branch): Settings > Pages > Source must be "GitHub Actions".
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A page opened alone in a browser needs the plain Emscripten build. The
  # ExaequOS build only runs inside the ExaequOS desktop (see build_exaequos).
  build_html5:
    name: Build the web version
    runs-on: ubuntu-22.04
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install pkg-config libmosquitto-dev libx11-dev libxinerama-dev
          sudo apt-get install libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev
          sudo apt-get install libwayland-dev libxkbcommon-x11-dev libglfw3-dev
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
      - name: Checkout TimedPetriNetEditor
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Compile TimedPetriNetEditor
        run: |
          emmake make
      # The old address (TimedPetriNetEditor.html) keeps working; index.html
      # opens the editor at the root of the site too.
      - name: Gather the page
        run: |
          mkdir -p site
          cp build/emscripten-debug/bin/TimedPetriNetEditor.* site/
          cp site/TimedPetriNetEditor.html site/index.html
          touch site/.nojekyll
          ls -la site
      - name: Keep the page for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy_html5:
    name: Publish on GitHub Pages
    needs: build_html5
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # The image sets EXAEQUOS and puts emscripten-exa on PATH. `make` then
  # installs exa-wayland and glfw, and writes the program in
  # media/localhost/TimedPetriNetEditor/exa/, kept as an artifact of the run.
  build_exaequos:
    name: Compile for ExaequOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TimedPetriNetEditor
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Compile with ExaequOS
        run: |
          mkdir -p "$HOME/.cache/exaequos"
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:$PWD" \
            -v "$HOME/.cache/exaequos:/opt/emscripten-exa/cache" \
            -w "$PWD" \
            lecrapouille/exaequos:light \
            bash -c 'make && make install'
      - name: Keep the ExaequOS build
        uses: actions/upload-artifact@v4
        with:
          name: TimedPetriNetEditor-exaequos
          path: media/localhost/TimedPetriNetEditor/exa/
